<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布教資料メーカー</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2330;--sub:#667085;--line:#d9dde4;--acc:#1c2330;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e232c;--ink:#eef0f4;--sub:#9aa3b2;--line:#323a47;--acc:#eef0f4}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e232c;--ink:#eef0f4;--sub:#9aa3b2;--line:#323a47;--acc:#eef0f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.5}
main{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:380px 1fr;gap:16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h1{font-size:18px;margin:0 0 12px}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input[type=text],textarea{width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:62px}
.cnt{font-size:12px;color:var(--sub);text-align:right}
.row{margin-top:10px}.row b{font-size:13px;display:block;margin-bottom:4px}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:28px;height:28px;border-radius:6px;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button.on{border-color:var(--acc);outline:2px solid var(--card);outline-offset:-4px}
.sw input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.sw small{font-size:11px;color:var(--sub)}
.btn{margin-top:16px;width:100%;padding:12px;font:inherit;font-weight:700;border:0;border-radius:8px;background:var(--acc);color:var(--card);cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.preview{position:sticky;top:8px;align-self:start}
canvas{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--line)}
.sz{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px}.sz span{width:56px;font-weight:700}.sz input[type=range]{flex:1}.sz b{width:24px;text-align:right}.sz input[type=number],.sz select{font:inherit;font-size:13px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}.sz input[type=number]{width:72px}.pad{display:flex;gap:6px;margin-top:6px}.pad button{flex:1;padding:8px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}.sw button.auto{width:auto;padding:0 8px;font-size:12px;color:var(--ink);background:var(--bg)}
.note{font-size:12px;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<main>
<section class="panel">
<h1>布教資料メーカー</h1>
<label class="f">スプレッドシートから入力</label>
<div class="sz"><button id="shBtn" type="button" style="display:none;font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer">シートを読み込む</button><select id="shRow" style="display:none;flex:1;min-width:0"></select></div>
<div class="note" id="shMsg"></div>
<details style="margin-top:8px"><summary style="font-size:13px;cursor:pointer">貼り付け・CSVで入力（HTMLを保存して使う場合はこちら）</summary>
<div class="note">シートで読み込みたい行のA〜F列を選んでコピーし、下に貼り付けて「反映」を押します（見出し行を含んでも構いません）。</div>
<textarea id="shPaste" placeholder="シートからコピーした内容をここに貼り付け"></textarea>
<div class="sz"><button id="shPasteBtn" type="button" style="font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer">反映</button></div>
<div class="note">または、シートを「ファイル→共有→ウェブに公開」でCSV形式に公開して、そのURLを入れます。</div>
<div class="sz"><input type="text" id="shUrl" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" style="flex:1;min-width:0;font:inherit;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)"><button id="shUrlBtn" type="button" style="font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer">読み込む</button></div>
</details>
<label class="f">① 書影（画像を選択）</label>
<input type="file" id="cover" accept="image/*">
<label style="font-size:13px;display:block;margin-top:6px"><input type="checkbox" id="shd" checked> 書影に影をつける</label>
<label class="f">書影の出典（左下に小さく表示）</label>
<input type="text" id="credit" placeholder="例: 版元ドットコム">
<label class="f">② あらすじ</label>
<textarea id="title" placeholder="あらすじ"></textarea>
<label class="f">③ オススメポイント（各70文字ほど）</label>
<textarea id="p1" placeholder="ポイント1"></textarea><div class="cnt" id="c1"></div>
<textarea id="p2" placeholder="ポイント2"></textarea><div class="cnt" id="c2"></div>
<textarea id="p3" placeholder="ポイント3"></textarea><div class="cnt" id="c3"></div>
<label class="f">文字サイズ</label>
<div class="sz"><span>あらすじ</span><label><input type="checkbox" id="aAuto" checked> 自動</label><input type="number" id="aSize" min="8" max="120" step="1" value="32" disabled><span style="width:auto">px</span></div>
<div class="sz"><span>オススメ</span><label><input type="checkbox" id="oAuto" checked> 自動</label><input type="number" id="oSize" min="8" max="120" step="1" value="28" disabled><span style="width:auto">px</span></div>
<div class="note">「自動」をオフにすると、枠からはみ出しても指定サイズのまま表示します。</div>
<label class="f">位置の微調整</label>
<div class="sz"><select id="tg"><option value="syn">あらすじ</option><option value="p1">オススメ1</option><option value="p2">オススメ2</option><option value="p3">オススメ3</option></select><span style="width:auto">移動量</span><input type="number" id="stp" min="1" max="200" step="1" value="5"><span style="width:auto">px</span></div>
<div class="pad"><button type="button" data-d="-1,0">←</button><button type="button" data-d="0,-1">↑</button><button type="button" data-d="0,1">↓</button><button type="button" data-d="1,0">→</button></div>
<label class="f">色（書影から自動抽出。クリックで変更）</label>
<div id="colors"></div>
<button class="btn" id="dl" disabled>PNGを保存</button>
<div class="note" id="msg"></div>
</section>
<section class="panel preview">
<div class="sz" style="margin:0 0 8px"><label><input type="checkbox" id="mv"> ドラッグで文字の位置を動かす（あらすじ・オススメ1〜3）</label><button id="rs" type="button" style="margin-left:auto;font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer">位置をリセット</button></div>
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="note">1920×1080。保存できない環境では、画像を長押し／右クリックで保存してください。</div>
</section>
</main>

function extract(img){
  const c=document.createElement('canvas'),s=64;c.width=c.height=s;
  const x=c.getContext('2d');x.drawImage(img,0,0,s,s);
  const d=x.getImageData(0,0,s,s).data,m=new Map();
  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;
    const k=(d[i]>>4)*256+(d[i+1]>>4)*16+(d[i+2]>>4);

  const tot=[...m.values()].reduce((a,e)=>a+e.n,0);
  const all=[...m.values()].map(e=>{const c=[e.r/e.n,e.g/e.n,e.b/e.n];return{c,n:e.n,sat:sat(c)}}).filter(e=>e.n>=tot*.002);
  if(!all.length)return [];
  const near=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])<45;
  const out=[];
  const add=c=>{if(c&&!out.some(o=>near(o,c)))out.push(c)};
  add(all.reduce((a,e)=>lum(e.c)<lum(a.c)?e:a).c);
  add(all.reduce((a,e)=>lum(e.c)>lum(a.c)?e:a).c);
  all.slice().sort((a,b)=>b.n*(1+3*b.sat)-a.n*(1+3*a.sat)).forEach(e=>{if(out.length<9)add(e.c)});

function tint(img,color,clear){
  const key=(img._id||(img._id=Math.random()))+color+(clear?1:0);
  if(_tc.has(key))return _tc.get(key);
  if(_tc.size>12)_tc.clear();
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d');x.drawImage(img,0,0);
  if(clear){x.save();x.globalCompositeOperation='destination-out';x.beginPath();clear.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fill();x.restore()}
  const id=x.getImageData(0,0,c.width,c.height),d=id.data,t=rgb(color),L0=34;

function wrap(text,maxW){
  const lines=[];
  for(const para of text.split('\n')){
    let cur='';
    for(const ch of para){
      if(ctx.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch}else cur+=ch}
    lines.push(cur);
  }
  return lines;
}

  for(let s=max;s>=min;s-=2){

    const vals=(v&&Array.isArray(v.values))?v.values:[];
    shRows=vals.filter(x=>Array.isArray(x)&&x.some(c=>String(c==null?'':c).trim()));
    sel.innerHTML='';
    shRows.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+2)+'行目: '+(String(x[0]||'').trim()||'（無題）');sel.appendChild(o)});
    if(!shRows.length){sel.style.display='none';msg.textContent='データの行が見つかりませんでした。'}
    else{sel.style.display='';shApply(0);msg.textContent=shRows.length+'件読み込みました。選んだ行が入力欄に入ります。'}
  }catch(e){
    const c=e&&e.code;
    msg.textContent=c==='server_not_connected'?'Google Sheetsが接続されていません。claude.aiの設定のコネクタから接続してください。':c==='needs_reauth'?'Google Sheetsの接続の期限が切れています。claude.aiの設定のコネクタで再接続してください。':(c==='approval_required'||c==='not_in_manifest'||c==='not_granted')?'Google Sheetsの利用が許可されていません。もう一度押して、許可してください。':c==='tool_error'?'シートを読み込めませんでした。シート名・範囲、閲覧権限を確認してください。':'読み込みに失敗しました。（'+(c||'error')+'）';
  }finally{b.disabled=false}
};
function parseTable(t){
  const d=t.split(/\r?\n/)[0].indexOf('\t')>=0?'\t':',',rows=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"'&&c==='')q=true;
    else if(ch===d){row.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';rows.push(row);row=[]}
    else c+=ch}
  if(c!==''||row.length){row.push(c);rows.push(row)}
  return rows;
}
function shFill(vals){
  const msg=$('shMsg'),sel=$('shRow');
  if(vals.length&&String(vals[0][0]||'').trim()==='タイトル')vals=vals.slice(1);
  shRows=vals.filter(x=>Array.isArray(x)&&x.some(c=>String(c==null?'':c).trim()));
  sel.innerHTML='';
  shRows.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'件目: '+(String(x[0]||'').trim()||'（無題）');sel.appendChild(o)});
  if(!shRows.length){sel.style.display='none';msg.textContent='データの行が見つかりませんでした。'}
  else{sel.style.display='';shApply(0);msg.textContent=shRows.length+'件読み込みました。選んだ行が入力欄に入ります。'}
}
$('shPasteBtn').onclick=()=>{const t=$('shPaste').value;if(!t.trim()){$('shMsg').textContent='貼り付け欄が空です。';return}shFill(parseTable(t))};
$('shUrlBtn').onclick=async()=>{
  const u=$('shUrl').value.trim(),msg=$('shMsg');
  if(!/^https:\/\/docs\.google\.com\//.test(u)){msg.textContent='Googleスプレッドシートの公開URLを入れてください。';return}
  msg.textContent='読み込み中…';
  try{const r=await fetch(u);if(!r.ok)throw new Error(r.status);shFill(parseTable(await r.text()))}
  catch(e){msg.textContent='URLから読み込めませんでした。公開設定とURLを確認するか、貼り付けの方法を使ってください。'}
};
function manual(p){return $(p+'Auto').checked?0:+$(p+'Size').value}
['aAuto','aSize','oAuto','oSize'].forEach(id=>['input','change'].forEach(ev=>$(id).addEventListener(ev,()=>{
  if(!$('aAuto').checked&&$('aSize').disabled)$('aSize').value=lastSz.a;
  if(!$('oAuto').checked&&$('oSize').disabled)$('oSize').value=lastSz.o;
  $('aSize').disabled=$('aAuto').checked;$('oSize').disabled=$('oAuto').checked;
  render()})));
$('dl').onclick=()=>{
  cv.toBlob(async blob=>{
    let dl=null;
    try{dl=await claude.use('downloads')}catch(e){}
    if(!dl){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='布教資料.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);$('msg').textContent='';return}
    try{await dl.save({filename:'布教資料.png',data:blob});$('msg').textContent=''}
    catch(e){if(e.code!=='declined')$('msg').textContent='保存できませんでした：'+(e.message||e.code)}
  },'image/png');
};
buildColors();
